name: forge review

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: forge-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.label.name == 'forge-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Run forge review
        env:
          FORGE_GH_TOKEN: ${{ secrets.FORGE_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: bun run scripts/ci-forge-review.ts
