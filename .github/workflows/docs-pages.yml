name: Deploy site to GitHub Pages

# Builds the full site artifact: landing (root) + VitePress docs (/docs/) +
# generated plugin docs (/plugins/). Requires GitHub Pages enabled with the
# "GitHub Actions" source (manual repository setting; see packaging/README.md).

on:
  push:
    branches: [main]
    paths:
      - 'marketplace/**'
      - 'packages/docs/**'
      - 'packages/landing/**'
      - 'packages/plugin-kernel/src/docs/**'
      - 'scripts/generate-plugin-docs.ts'
      - 'scripts/generate-demo-gifs.ts'
      - 'scripts/assemble-pages-site.ts'
      - 'scripts/pages-site.test.ts'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build site packages
        run: bunx turbo build --filter=@forge/server... --filter=@forge/docs --filter=@forge/landing
      - name: Assemble Pages artifact
        run: bun run scripts/assemble-pages-site.ts
      - name: Verify all pages load and every link resolves
        run: bun test scripts/pages-site.test.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
