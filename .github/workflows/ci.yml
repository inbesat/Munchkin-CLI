name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install ripgrep
        # The glob/grep tools shell out to rg; not present on all runner images.
        run: sudo apt-get install -y ripgrep

      - name: Lint
        run: bun run lint

      - name: Typecheck
        # @forge/tui is temporarily excluded: it has a committed build defect
        # (packages/tui/src/app.tsx:300) tracked as a separate TUI repair
        # stream in AGENTS.md. Re-add it when that stream lands.
        run: bunx turbo typecheck --filter=!@forge/tui

      - name: Build
        # Same TUI exclusion as Typecheck above.
        run: bunx turbo build --filter=!@forge/tui

      - name: Test
        # Same TUI exclusion as Typecheck above. Tests also skip the two
        # bash-on-Windows known-fail integration tests by running on Linux.
        run: bunx turbo test --filter=!@forge/tui

      - name: Test build scripts
        run: bun test scripts

  # Validate PR metadata
  pr-check:
    name: PR Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PR title follows conventional commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            test
            docs
            chore
            ci
            perf
            build
