name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64
          - os: macos-latest
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The TUI workspace is not needed for the CLI binary and its build is
      # currently broken (separate repair stream); build only what the server
      # binary imports.
      - name: Build CLI dependencies
        run: bunx turbo build --filter=@forge/server...

      # Phase 149: compiles packages/server/src/bin/forge.ts (the real CLI
      # entry) for the matrix target and smoke-runs it on native runners.
      - name: Compile binary
        run: bun run scripts/build-binary.ts --target ${{ matrix.target }} --smoke

      # Phase 150: WinGet installs a portable archive whose root contains
      # forge.exe; package it as forge-win-x64.zip alongside the raw binary.
      - name: Package Windows zip (WinGet)
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          Copy-Item forge-win-x64.exe forge.exe
          Compress-Archive -Path forge.exe -DestinationPath forge-win-x64.zip
          Remove-Item forge.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.target }}
          path: forge-${{ matrix.target }}*

  # Phase 146: regression gate - pinned eval tasks must not regress before a
  # release is published. Requires the ANTHROPIC_API_KEY repository secret.
  regression:
    name: Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI dependencies
        run: bunx turbo build --filter=@forge/server...

      - name: Run regression suite
        run: bun packages/server/dist/bin/forge.js eval regress --json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORGE_NO_UPDATE_CHECK: "1"

  publish:
    name: Create GitHub Release
    needs: [release, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Phase 150: `HASH  filename` lines consumed by the Scoop manifest's
      # autoupdate hash lookup and copied into the Homebrew formula/WinGet
      # InstallerSha256 (see packaging/README.md).
      - name: Checksums
        run: cd artifacts && sha256sum * > ../checksums.txt && cat ../checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
